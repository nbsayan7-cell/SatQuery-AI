# Save this file to .github/workflows/keepalive.yml on GitHub
# to automatically ping your Render backend every 10 minutes 24/7!

name: SatQuery 24/7 Backend Keep-Alive

on:
  schedule:
    # Runs every 10 minutes, keeping Render / Koyeb free tier servers awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://satquery-backend.onrender.com"
          fi
          echo "Sending keep-alive pulse to: ${TARGET_URL}/api/health"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 45 "${TARGET_URL}/api/health" || true)
          echo "Response: $RESPONSE"
